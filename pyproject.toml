[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfos-api"
version = "0.8.0"
description = "Lightweight, synchronous Python client for Sophos Firewall OS (SFOS) REST API using StrEnum"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Dimitar (Mitko) Nikolov", email = "mitko.nikolov@integrity360.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "PyYAML>=6.0",
    "ruff>=0.3.0",
]
examples = [
    "utils-api>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/Mitko-n/sfos-api"
Documentation = "https://github.com/Mitko-n/sfos-api/tree/main/docs"
Repository = "https://github.com/Mitko-n/sfos-api"
Issues = "https://github.com/Mitko-n/sfos-api/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sfos_api*"]

[tool.setuptools.package-data]
sfos_api = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
exclude = [
    ".venv",
    "venv",
    ".git",
    "build",
    "dist",
    "docs/.sophos_firewall_api_docs",
    "src/sfos_api/_spec_metadata.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["F401", "BLE001", "E402", "F841"]
"*.ipynb" = ["E402", "F401", "F811", "T201", "F841", "RUF019"]
"tests/**" = ["SIM300"]

[tool.pyright]
include = ["src/sfos_api", "tests"]
extraPaths = ["src", "."]
pythonVersion = "3.11"
typeCheckingMode = "standard"
